name: Build macOS App

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: macos-app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: macos-14

    strategy:
      matrix:
        variant: [standard, dictation]
        include:
          - variant: standard
            label: Standard
            zip_suffix: Standard-macOS
            pip_extras: ""
          - variant: dictation
            label: Dictation
            zip_suffix: Dictation-macOS
            pip_extras: faster-whisper sounddevice

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install native dependencies
        run: |
          brew update
          brew install gtk4 libadwaita gobject-introspection cairo pkg-config librsvg poppler git portaudio

      - name: Configure Homebrew GTK paths
        run: |
          brew_prefix="$(brew --prefix)"
          {
            echo "HOMEBREW_PREFIX=${brew_prefix}"
            echo "PKG_CONFIG_PATH=${brew_prefix}/lib/pkgconfig:${brew_prefix}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "GI_TYPELIB_PATH=${brew_prefix}/lib/girepository-1.0:${GI_TYPELIB_PATH:-}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${brew_prefix}/lib:/usr/local/lib:/usr/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
            echo "XDG_DATA_DIRS=${brew_prefix}/share:/usr/local/share:/usr/share:${XDG_DATA_DIRS:-}"
            echo "GTK_DATA_PREFIX=${brew_prefix}"
          } >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install pyinstaller pyinstaller-hooks-contrib
          if [ -n "${{ matrix.pip_extras }}" ]; then
            python -m pip install ${{ matrix.pip_extras }}
          fi

      - name: Verify GTK import path
        run: |
          python - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, Gtk
          print(f"GTK {Gtk.MAJOR_VERSION}.{Gtk.MINOR_VERSION}, Adw {Adw.MAJOR_VERSION}.{Adw.MINOR_VERSION}")
          PY

      - name: Generate app icon
        run: bash packaging/macos/make-icon.sh

      - name: Build app bundle
        run: |
          TOKYO_NOTES_DICTATION=${{ matrix.variant == 'dictation' && '1' || '0' }} \
            pyinstaller packaging/macos/tokyo-notes.spec --noconfirm --clean

      - name: Validate app bundle
        run: |
          test -d "dist/Tokyo Notes.app"
          test -x "dist/Tokyo Notes.app/Contents/MacOS/Tokyo Notes"
          plutil -lint "dist/Tokyo Notes.app/Contents/Info.plist"
          # Verify NSMicrophoneUsageDescription is present only in dictation build
          if [ "${{ matrix.variant }}" = "dictation" ]; then
            plutil -extract NSMicrophoneUsageDescription raw "dist/Tokyo Notes.app/Contents/Info.plist" > /dev/null
          else
            ! plutil -extract NSMicrophoneUsageDescription raw "dist/Tokyo Notes.app/Contents/Info.plist" 2>/dev/null
          fi

      - name: Ad-hoc sign app bundle
        run: codesign --force --deep --sign - "dist/Tokyo Notes.app"

      - name: Archive app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Tokyo Notes.app" \
            "Tokyo-Notes-${{ matrix.zip_suffix }}-arm64.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tokyo-Notes-${{ matrix.zip_suffix }}-arm64
          path: Tokyo-Notes-${{ matrix.zip_suffix }}-arm64.zip

      - name: Publish latest macOS release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: macos-latest
          RELEASE_TITLE: Latest macOS Build
          ASSET_PATH: Tokyo-Notes-${{ matrix.zip_suffix }}-arm64.zip
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${RELEASE_TAG}"

          notes="Latest successful macOS arm64 build from commit ${GITHUB_SHA}.

          Assets:
          - **Tokyo-Notes-Standard-macOS-arm64.zip**: Standard build without dictation.
          - **Tokyo-Notes-Dictation-macOS-arm64.zip**: Includes offline speech-to-text dictation (larger download).
          "


          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --title "$RELEASE_TITLE" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
