repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^core/templates/
      - id: end-of-file-fixer
        exclude: ^core/templates/
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -q
        language: python
        additional_dependencies: [pytest, pygobject, pycairo, cryptography, GitPython, pyspellchecker]
        types: [python]
        pass_filenames: false
